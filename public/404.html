<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | MTD Signs & Graphics</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
        background: #0a0a0a;
        color: #f2f0ec;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at 80% 15%, rgba(76, 112, 235, 0.14), transparent 28%), #0a0a0a;
      }
      main { width: min(100%, 46rem); }
      img { width: min(18rem, 65vw); height: auto; }
      p {
        max-width: 39rem;
        color: rgba(242, 240, 236, 0.7);
        font-size: 1.05rem;
        line-height: 1.65;
      }
      .eyebrow {
        margin-top: 2.5rem;
        color: #4c70eb;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.65rem 0 1.25rem;
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: clamp(3.5rem, 11vw, 7rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 0.88;
        text-transform: uppercase;
      }
      h1 span { color: #ff6d01; }
      nav { display: flex; flex-wrap: wrap; gap: 0.9rem 1.5rem; margin-top: 2rem; }
      a {
        min-height: 3rem;
        display: inline-flex;
        align-items: center;
        color: #f2f0ec;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:first-child { padding: 0 1.25rem; background: #ff6d01; color: #0a0a0a; }
      a:last-child:hover { color: #4c70eb; }
    </style>
  </head>
  <body>
    <main>
      <img src="/mtd-logo-480.webp" alt="MTD Signs & Graphics" />
      <p class="eyebrow">404 · Page not found</p>
      <h1>Wrong <span>Turn.</span></h1>
      <p>The page you requested does not exist or has moved. Return to MTD Signs & Graphics to view signs, wraps, identity work, and specialty projects.</p>
      <nav aria-label="Page not found navigation">
        <a href="/">Return Home</a>
        <a href="/#work">View Featured Work</a>
      </nav>
    </main>
  </body>
</html>
