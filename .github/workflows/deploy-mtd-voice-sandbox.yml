# Public test endpoint with ONLY the signed Twilio voice webhook. No MTD admin.
# Runs exclusively from the isolated assistant branch; the main site is untouched.
name: Deploy isolated MTD phone sandbox

on:
  push:
    branches:
      - feature/mtd-ai-assistant-v1
    paths:
      - .github/workflows/deploy-mtd-voice-sandbox.yml
      - scripts/build-voice-sandbox.mjs
      - scripts/configure-voice-sandbox.mjs
      - scripts/test-voice-sandbox.mjs
      - scripts/configure-voice-secret.mjs
      - scripts/test-deployed-voice-webhook.mjs
      - scripts/inspect-twilio-numbers.mjs
      - scripts/connect-twilio-voice.mjs
      - scripts/test-connect-twilio-voice.mjs
      - functions/api/voice.ts
      - functions/lib/voice-receptionist.ts
      - functions/lib/access.ts

permissions:
  contents: read

concurrency:
  group: mtd-isolated-phone-webhook-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nerdxLinc/mtd-signs-website' && github.ref == 'refs/heads/feature/mtd-ai-assistant-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolation and deployment guards
        run: node scripts/test-voice-sandbox.mjs
      - name: Test guarded Twilio trial number routing
        run: node scripts/test-connect-twilio-voice.mjs
      - name: Prepare minimal standalone voice endpoint
        run: node scripts/build-voice-sandbox.mjs
      - name: Create isolated project with Preview D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c6920b6bea2391db4a4b10c0a2f97f45
        run: node scripts/configure-voice-sandbox.mjs
      - name: Configure encrypted Twilio request authentication if supplied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c6920b6bea2391db4a4b10c0a2f97f45
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: node scripts/configure-voice-secret.mjs
      - name: Deploy voice sandbox without private MTD routes
        working-directory: .voice-sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c6920b6bea2391db4a4b10c0a2f97f45
        run: npx --yes wrangler@4 pages deploy dist --project-name mtd-voice-sandbox --branch main
      - name: Verify signed public phone endpoint without creating a lead
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: node scripts/test-deployed-voice-webhook.mjs
      - name: Inspect Twilio trial number inventory if account ID is securely configured
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        run: |
          if [ -n "$TWILIO_ACCOUNT_SID" ]; then
            node scripts/inspect-twilio-numbers.mjs
          else
            echo "Twilio number inspection deferred: TWILIO_ACCOUNT_SID GitHub secret is not configured."
          fi
      - name: Connect one unused/default trial number only after webhook test passes
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        run: |
          if [ -n "$TWILIO_ACCOUNT_SID" ]; then
            node scripts/connect-twilio-voice.mjs
          else
            echo "Twilio call routing deferred: TWILIO_ACCOUNT_SID GitHub secret is not configured."
          fi
