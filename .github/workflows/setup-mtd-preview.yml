# Runs only from the isolated assistant branch, never from main or a pull request.
# Recheck preview setup after the repository secret was added.
# Put a short-lived Cloudflare token in Settings > Secrets and variables > Actions
# as CLOUDFLARE_API_TOKEN. Do not add credentials to source or chat messages.
name: Set up MTD test environment

on:
  push:
    branches:
      - feature/mtd-ai-assistant-v1
    paths:
      - .github/workflows/setup-mtd-preview.yml
      - scripts/setup-preview-cloudflare.mjs
      - migrations/0008_assistant_rate_limits.sql
      - migrations/0009_phone_inquiries.sql

permissions:
  contents: read

concurrency:
  group: mtd-cloudflare-preview-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == 'nerdxLinc/mtd-signs-website' && github.ref == 'refs/heads/feature/mtd-ai-assistant-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated Preview database and binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c6920b6bea2391db4a4b10c0a2f97f45
        run: node scripts/setup-preview-cloudflare.mjs --apply
